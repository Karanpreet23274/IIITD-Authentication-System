<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Offline · IIITD Gate</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #17232a; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0f1719; color: #e3ecee; } p { color: #9db0b6 !important; } }
  img { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: #5a6a72; max-width: 32ch; margin: 0 auto 20px; line-height: 1.5; }
  button { font: inherit; font-weight: 600; background: #0f766e; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>The gate QR needs an internet connection so it can be checked live. Connect to Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
